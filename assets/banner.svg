<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .type { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 3s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .fade { opacity: 0; animation: fade 1.2s ease-out 1.2s forwards; }
      @keyframes fade { to { opacity: 1; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#30363d"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="26" r="6" fill="#27c93f"/>
  <text x="450" y="31" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">martin@nairobi: ~</text>

  <text x="40" y="92" class="mono" font-size="20" fill="#2ea043">$</text>
  <text x="62" y="92" class="mono" font-size="20" fill="#c9d1d9">whoami</text>

  <text x="40" y="150" class="mono" font-size="44" font-weight="700" fill="url(#accent)">Martin Wangari</text>
  <text x="40" y="188" class="mono fade" font-size="18" fill="#8b949e">Software Developer  •  IT Systems Support  •  Nairobi, KE</text>

  <rect x="40" y="206" width="520" height="3" rx="1.5" fill="url(#accent)" class="type"/>

  <text x="40" y="238" class="mono fade" font-size="15" fill="#58a6ff">&gt; available now: full-time, contract &amp; freelance_</text>
  <rect x="480" y="224" width="9" height="17" fill="#58a6ff" class="cursor"/>

  <g class="pulse">
    <circle cx="760" cy="110" r="5" fill="#2ea043"/>
    <circle cx="810" cy="150" r="5" fill="#58a6ff"/>
    <circle cx="770" cy="200" r="5" fill="#2ea043"/>
    <circle cx="850" cy="95" r="4" fill="#58a6ff"/>
    <line x1="760" y1="110" x2="810" y2="150" stroke="#30363d"/>
    <line x1="810" y1="150" x2="770" y2="200" stroke="#30363d"/>
    <line x1="810" y1="150" x2="850" y2="95" stroke="#30363d"/>
  </g>
</svg>
